name: Nesalio digital logic validation
on:
  pull_request:
    paths:
      - 'app/src/domain/simulation/**'
      - 'app/src/ui/logic/**'
      - 'app/src/app/logic-lab/**'
      - 'app/package*.json'
      - '.github/workflows/digital-logic.yml'
  push:
    branches: [feat/digital-logic-simulator-core]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- src/domain/simulation
      - run: npm run build
